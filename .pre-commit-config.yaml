# Fast, local checks. The authority is CI (.github/workflows/ci.yml); this is
# here so a failing commit is caught in a second rather than in three minutes.
#
#   uv run pre-commit install
#
# Hook versions are pinned. `uv run pre-commit autoupdate` bumps them.

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      # Catches a .env or a private key before it is committed rather than
      # after it is pushed, at which point rotation is the only fix.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Keeps uv.lock in step with pyproject.toml. CI runs `uv sync --locked`, so a
  # stale lockfile fails there; this catches it before the push.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.7
    hooks:
      - id: uv-lock
