# Applies Alembic migrations to the production database after a merge.
#
# FastAPI Cloud deploys the API on its own and has no boot step, so nothing
# else runs `alembic upgrade head`. This runs about a minute behind the
# deploy, which means a migration has to be compatible with the code that is
# still serving: add a column first, switch the code, drop the old one in a
# later change.
#
# The environment is the same WORKER_ENV_JSON secret worker.yml uses; alembic
# only needs DATABASE_URL, but app.config validates the rest of the settings
# on import. Nothing is printed.
name: Migrate

on:
  push:
    branches: [main]
    paths:
      - "alembic/**"
      - "alembic.ini"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  # Two migrations must never run at once, and none may be cut off midway.
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: alembic upgrade head
        env:
          WORKER_ENV_JSON: ${{ secrets.WORKER_ENV_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          env = json.loads(os.environ["WORKER_ENV_JSON"])
          for value in env.values():
              for line in str(value).splitlines():
                  if len(line) >= 6:
                      print(f"::add-mask::{line}")

          sys.exit(
              subprocess.run(
                  ["uv", "run", "alembic", "upgrade", "head"],
                  env={**os.environ, **env},
              ).returncode
          )
          PY
