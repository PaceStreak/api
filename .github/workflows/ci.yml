# Lint, type-check and test. This workflow does not deploy - there is nowhere
# to deploy to yet, and when there is, that belongs in its own workflow with
# its own permissions.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs, not tags: tags are mutable, and a
      # moved tag is a supply-chain compromise that leaves no diff.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Installs the interpreter named in .python-version, so CI and a
      # developer's machine cannot silently be on different Python versions.
      - name: Install Python
        run: uv python install

      # `--locked` asserts uv.lock is already in step with pyproject.toml and
      # fails if it is not, rather than resolving something that was never
      # tested. Note it is mutually exclusive with UV_FROZEN, which tells uv to
      # skip that check entirely - setting both is an error, not a belt and
      # braces.
      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      # ty is pre-1.0. It is pinned through uv.lock, so a release cannot break
      # this job without an explicit dependency bump in a reviewable commit.
      - name: Type-check
        run: uv run ty check

      - name: Test
        run: uv run pytest

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Build the container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The Dockerfile uses `RUN --mount`, which is BuildKit-only. Runners
      # default to BuildKit, but stating it means the job fails loudly on a
      # runner image that does not rather than at the first `--mount` line.
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds only. Nothing is pushed to a registry, because nothing consumes
      # the image yet - this exists so the Dockerfile cannot rot unnoticed
      # between now and the first deploy.
      - name: Build
        run: docker build --tag pacestreak-api:ci .

      - name: Smoke-test the image
        run: |
          docker run --rm --detach --name api -p 8000:8000 pacestreak-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "health check passed"
              docker rm --force api
              exit 0
            fi
            sleep 1
          done
          echo "::error::the container never reported healthy"
          docker logs api
          docker rm --force api
          exit 1
