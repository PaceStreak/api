# Fails a pull request before it reaches main. It deploys nothing and needs no secrets:
# deploys are Workers Builds' job (DESIGN.md §16).
name: CI

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runtime types are current
        run: pnpm types:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint and format
        run: pnpm biome ci .
      - name: Module boundaries
        run: pnpm check:deps
      - name: Migrations match the schema
        run: |
          pnpm drizzle-kit check
          pnpm drizzle-kit generate --name ci-drift-probe
          git diff --exit-code -- migrations || { echo "schema changed without a migration"; exit 1; }
          test -z "$(git status --porcelain -- migrations)" || { echo "schema changed without a migration"; exit 1; }
          pnpm db:fk-users
          git diff --exit-code -- src/db/fk-users.gen.ts
      - name: Tests
        run: pnpm vitest run
      - name: Ported test names (pytest parity)
        run: pnpm check:parity
      - name: Bundle builds within budget
        run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: gitleaks (working tree)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --redact --no-banner --exit-code 1
