# Runs one scheduler tick (`python -m app.worker --once`) from the published
# image. This replaces the long-running `worker` service for hosts that have
# no always-on process: app/worker.py takes a Redis lock per tick and dedupes
# every notification, so a late or overlapping run is safe.
#
# The whole environment lives in one repository secret, WORKER_ENV_JSON: a
# JSON object of NAME -> value (PEM keys contain newlines, which a dotenv
# file cannot carry). Nothing here is printed; every value is masked first.
#
# GitHub Actions cron is best-effort and can start several minutes late. It
# also disables scheduled workflows after 60 days without repository
# activity, so a quiet repo needs an occasional push or manual run.
name: Worker tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: worker-tick
  # A tick still running is doing real work; the next one can wait its turn.
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run one tick
        env:
          WORKER_ENV_JSON: ${{ secrets.WORKER_ENV_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          env = json.loads(os.environ["WORKER_ENV_JSON"])
          for value in env.values():
              for line in str(value).splitlines():
                  if len(line) >= 6:
                      print(f"::add-mask::{line}")

          cmd = ["docker", "run", "--rm"]
          for key, value in env.items():
              cmd += ["-e", f"{key}={value}"]
          cmd += [
              "ghcr.io/pacestreak/api:latest",
              "python", "-m", "app.worker", "--once",
          ]
          sys.exit(subprocess.run(cmd).returncode)
          PY
