# Base stack: the API, Postgres and Redis.
#
#   docker compose up --build              development (compose.override.yaml
#                                          is picked up automatically)
#   docker compose -f compose.yaml up      production-shaped, no override
#
# The only thing that changes between the two is APP_MODE, which the entrypoint
# turns into `fastapi dev` or `fastapi run`.
#
# Defaults are inline (${VAR:-default}), so this runs with no .env file. Copy
# .env.example to .env to override any of them.

name: pacestreak-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Anchored so the worker below runs with exactly the same configuration -
    # two copies of this block would drift the first time someone edits one.
    environment: &api-env
      APP_MODE: ${APP_MODE:-prod}
      APP_MODULE: ${APP_MODULE:-app.main:app}
      APP_PORT: ${APP_PORT:-8000}

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pacestreak}:${POSTGRES_PASSWORD:-pacestreak}@postgres:5432/${POSTGRES_DB:-pacestreak}
      REDIS_URL: redis://redis:6379/0

      # Auth settings. Passed through from the host/.env so `docker compose up`
      # and `make run` (no containers) read the same values - see .env.example
      # for what each one does.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-True}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-./keys/private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-./keys/public.pem}
      JWT_ISSUER: ${JWT_ISSUER:-api.pacestreak.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pacestreak}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-False}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-False}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@pacestreak.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Raised for the app's end-to-end tests, which make an account each.
      RATE_LIMIT_SIGNUP: ${RATE_LIMIT_SIGNUP:-5/minute}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10/minute}
      RATE_LIMIT_MFA_VERIFY: ${RATE_LIMIT_MFA_VERIFY:-10/minute}
      VAPID_PRIVATE_KEY_PATH: ${VAPID_PRIVATE_KEY_PATH:-./keys/vapid_private.pem}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@pacestreak.com}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-120}

      # Deliberately valueless. A key with no value passes the host's variable
      # through only if it is actually set; writing
      # `WEB_CONCURRENCY: ${WEB_CONCURRENCY:-}` instead sets it to the EMPTY
      # STRING, and uvicorn tests for presence rather than emptiness - it runs
      # int("") and dies at startup with a stack trace that says nothing about
      # compose. The entrypoint also unsets empties as a second line of
      # defence.
      #
      # WEB_CONCURRENCY: worker processes. Leave unset on a platform that
      # scales by running more containers - workers inside a replicated
      # container multiply memory for nothing.
      WEB_CONCURRENCY:
      # FORWARDED_ALLOW_IPS: addresses uvicorn will trust X-Forwarded-* from.
      # Inside a compose network the peer is another container; "*" would let
      # any caller forge a client IP, so never set it on an exposed service.
      FORWARDED_ALLOW_IPS:
    volumes:
      # Read-only: the container signs tokens with the private key, it never
      # needs to write it. Not committed - see .gitignore and `make keys`.
      - ./keys:/srv/keys:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      # `service_healthy`, not `service_started`. Postgres accepts TCP
      # connections seconds before it will accept queries, so starting the API
      # on "started" produces a crash loop that looks like an application bug.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python, not curl: the slim base image has no curl, and installing one
      # to check a health endpoint is a package to patch forever.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000${API_HEALTH_PATH:-/health}", timeout=3) as r:
                  sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 5
      # Gives the process time to boot before a failure counts against it,
      # instead of restarting a container that was merely still starting.
      start_period: 20s
    networks: [backend]

  # Streak refreshes, reminders, digests, challenge results and account purges
  # (app/worker.py). Same image, different command - the entrypoint execs any
  # arguments it is given instead of starting the web server.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    volumes:
      - ./keys:/srv/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pacestreak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pacestreak}
      POSTGRES_DB: ${POSTGRES_DB:-pacestreak}
      # Postgres only applies initdb arguments on first boot, when the volume
      # is empty. Changing them later does nothing until the volume is dropped.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data.
      #
      # Postgres 18 changed this. The image now stores data in a
      # major-version-specific subdirectory so `pg_upgrade --link` does not
      # have to cross a mount boundary, and it refuses to start when it finds
      # data at the old path with nothing mounted at the new one. On 17 and
      # earlier the correct path is /var/lib/postgresql/data - moving between
      # the two is a dump and restore, not a volume rename.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -U and -d matter: bare `pg_isready` checks the default database, which
      # can report ready while the one the app uses is not.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pacestreak} -d ${POSTGRES_DB:-pacestreak}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Not published to the host here. The dev override does that; production
    # has no reason to expose a database on a public interface.
    networks: [backend]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # --appendonly: without it a restart silently empties whatever is in here,
    # which is fine for a cache and not fine for a rate limiter or a session
    # denylist.
    #
    # --maxmemory-policy noeviction: under an LRU policy Redis cannot tell a
    # cached user (auth:user:*) from a logout revocation record
    # (auth:revoked_sid:*), and evicting the latter to make room for the
    # former would quietly un-revoke a logged-out session. Refusing the write
    # instead is the correct failure - see app/auth/cache.py.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [backend]

volumes:
  pgdata:
  redisdata:

networks:
  backend:
    driver: bridge
