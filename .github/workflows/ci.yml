# Fails a pull request before it reaches main. It does not deploy anything -
# that's publish.yml, which runs after a merge and only builds/pushes the
# image; a watchtower container on the host does the rest (see
# compose.gcp.yaml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests

  test:
    runs-on: ubuntu-latest
    # The suite runs against real Postgres and Redis; nothing is mocked.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pacestreak
          POSTGRES_PASSWORD: pacestreak
          POSTGRES_DB: pacestreak_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pacestreak -d pacestreak_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pacestreak:pacestreak@localhost:5432/pacestreak_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Generate throwaway signing keys
        run: make keys vapid
      - run: uv run alembic upgrade head
      - name: Migrations match the models
        run: uv run alembic check
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Production image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
