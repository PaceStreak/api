# Development overrides. Docker Compose loads this automatically, so plain
# `docker compose up` is the development stack and
# `docker compose -f compose.yaml up` is the production-shaped one.
#
# Nothing here should ever run in production: it mounts source over the image
# and publishes the database to the host.

services:
  api:
    # Run as the host user in development, so the bind-mounted keys can stay
    # 0600 and owned by you. The image's own user is uid 1001, which cannot
    # read a 0600 file owned by uid 1000 - the old workaround was to make the
    # private keys world-readable. Production does not mount keys at all
    # (see compose.prod.yaml), so this only applies here.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # The one switch. The entrypoint turns this into `fastapi dev`, which
      # enables reload and verbose startup output.
      APP_MODE: dev

    # Source is mounted over the copy baked into the image so reload sees edits
    # without a rebuild. Read-only: the container has no reason to write to
    # your working tree, and a stray file owned by uid 1001 is annoying to
    # remove.
    volumes:
      - ./app:/srv/app:ro
      # Migrations too: without this the container only sees the revisions
      # baked in at build time, and `make migrate` silently stops short of
      # head while the models already expect the new tables.
      - ./alembic:/srv/alembic:ro

    # The image's dependencies are frozen at build time. After changing
    # pyproject.toml or uv.lock, rebuild - the mount only covers source:
    #
    #   docker compose up --build
    develop:
      watch:
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: pyproject.toml

  worker:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./app:/srv/app:ro

  postgres:
    # Published so psql, a GUI client or a migration run from the host can
    # reach it. Bound to 127.0.0.1 explicitly: "5432:5432" would listen on
    # every interface, and on a laptop on a shared network that is a database
    # with a default password open to the room.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
