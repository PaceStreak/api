[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AlzyWelzy", email = "welzyalzy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[all]>=0.141.1",
    "pydantic-settings>=2.7.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "greenlet>=3.5.5",
    "redis>=6.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt[crypto]>=2.13.0",
    "pyotp>=2.10.0",
    "slowapi>=0.1.9",
    "pywebpush>=2.5.0",
    "fitdecode>=0.11.0",
    "defusedxml>=0.7.1",
    "webauthn>=2.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.ruff]
line-length = 100
target-version = "py314"


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's dependency injection requires `Depends(...)` as an argument
# default - that is the documented pattern, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.14"
