# Nightly off-host backup: the production D1 database copied into Neon Postgres
# (schema d1_backup), replaced in one transaction each night. Owner decision,
# 2026-10-19. Restore notes: infra/OPERATING-GUIDE.md.
name: Backup D1 to Neon

on:
  schedule:
    - cron: "0 18 * * *" # 23:30 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Reads every table through D1's query API: the export endpoint refused an account D1 Edit token.
      - name: Copy D1 into Neon
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 66803bc7-f7b4-40c7-ba13-e93c63753183
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python3 scripts/backup-to-neon.py --api "$NEON_DATABASE_URL"
